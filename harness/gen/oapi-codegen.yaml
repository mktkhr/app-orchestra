# yaml-language-server: $schema=https://raw.githubusercontent.com/oapi-codegen/oapi-codegen/v2.8.0/configuration-schema.json
# Go code generation options, shared by every service. `make generate` passes
# the spec and the output path per service, so this file names neither.
package: openapi
generate:
  models: true
  std-http-server: true
  strict-server: true
  embedded-spec: true
output-options:
  skip-prune: false
