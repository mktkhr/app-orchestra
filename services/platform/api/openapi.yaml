openapi: 3.0.3
info:
  title: Platform API
  version: 0.1.0
  description: >
    Orchestration platform: turns a natural-language question into one API
    call against a running service, and renders its result. See
    docs/specs/orchestration.md for the full design.
servers:
  - url: /
    description: The platform serves its own API and static assets from one origin.
security: []
tags:
  - name: system
    description: Service health and readiness endpoints.
  - name: session
    description: >
      Signing a person in and out. A session is an opaque token in an
      HttpOnly, SameSite cookie (docs/specs/auth.md, A2); every other path
      answers 401 without one.
  - name: plan
    description: >
      Turns a question into a decision: call an endpoint, ask the user to
      disambiguate a value, or report that nothing fits. Never mutates state.
  - name: invoke
    description: >
      Executes a confirmed call against a service. The only mouth through
      which the platform mutates anything; never calls the planner.
  - name: workspaces
    description: >
      A person's saved collections of panels - each panel a saved call,
      re-run through /api/invoke whenever its workspace is opened. See
      docs/specs/workspaces.md.
  - name: users
    description: >
      The admin's endpoints: reading every account and setting what one of
      them may call (docs/specs/auth.md, A5, section 4). Admin only - a
      non-admin gets 403 from every path here.
  - name: catalog
    description: >
      What the signed-in person may build a panel from: every operation
      they may call, with its arguments schema and its response fields
      (docs/specs/dashboard.md, section 5). Narrowed by the same rule
      /api/plan and /api/invoke use - not to be confused with
      /api/operations, the admin's flat list of everything the deployment
      has, for the permission grid.
paths:
  /api/health:
    get:
      operationId: getHealth
      summary: Report whether the platform is up.
      description: >
        Always returns 200 with a fixed body once the process is serving
        traffic. Used by the dev server, the browser guards and infrastructure
        health checks.
      tags:
        - system
      responses:
        "200":
          description: The platform is up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /api/session:
    post:
      operationId: postSession
      summary: Sign in.
      description: >
        Checks name and password against the platform's accounts
        (docs/specs/auth.md, A1). On success, sets the session cookie and
        returns the signed-in user; a wrong name or password is 401, with
        no cookie set.
      tags:
        - session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignInRequest"
      responses:
        "200":
          description: Signed in. The response carries the session cookie.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: The name or password is wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getSession
      summary: Who is signed in.
      description: The signed-in user, or 401 when nobody is.
      tags:
        - session
      responses:
        "200":
          description: The signed-in user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Nobody is signed in.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteSession
      summary: Sign out.
      description: >
        Ends the session named by the cookie, if any, and clears it.
        Signing out when nobody is signed in is not an error.
      tags:
        - session
      responses:
        "204":
          description: Signed out. The session cookie is cleared.
  /api/plan:
    post:
      operationId: postPlan
      summary: Turn a question into a decision and, when safe, its result.
      description: >
        One LLM call decides which endpoint of which service answers the
        question. A safe method (GET, HEAD, QUERY) is invoked immediately and
        its result rendered (`kind: result`). An unsafe method comes back as
        a form to confirm (`kind: form`) instead of being invoked. An
        ambiguous enum value comes back as a question to the user
        (`kind: ask`); resubmit the same query with `answers` filled in to
        continue. No endpoint fitting the question yields `kind: none`. The
        API result never goes back to the model: one request is one LLM call.
      tags:
        - plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "200":
          description: The decision, and its result when one was safe to fetch.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanResult"
        "501":
          description: >
            The decision reached a path this deployment does not implement
            yet (a disambiguation question).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The planner failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/invoke:
    post:
      operationId: postInvoke
      summary: Execute a confirmed call against a service.
      description: >
        Looks the operation up in the catalogue, validates the arguments
        against its schema, calls it, and renders the result. Never calls
        the planner; every method goes through here because a person pressed
        the button. This is where the permission check goes once
        authentication arrives.
      tags:
        - invoke
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvokeRequest"
      responses:
        "200":
          description: The call's result, rendered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvokeResult"
        "400":
          description: >
            The service or operation id is not in the catalogue, or the
            arguments do not satisfy its schema.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: The call to the service failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/workspaces:
    get:
      operationId: listWorkspaces
      summary: List the stub owner's workspaces.
      description: >
        Every workspace belongs to the stub user until authentication
        exists (W6, docs/specs/workspaces.md). No panel data is returned
        here - only panelCount - because opening a workspace re-runs its
        panels through /api/invoke instead of storing their answers (W2).
      tags:
        - workspaces
      responses:
        "200":
          description: The stub owner's workspaces, most recently created last.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WorkspaceSummary"
    post:
      operationId: createWorkspace
      summary: Create an empty workspace.
      tags:
        - workspaces
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkspaceRequest"
      responses:
        "201":
          description: The workspace was created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceCreated"
  /api/workspaces/{id}:
    get:
      operationId: getWorkspace
      summary: Read one workspace and its panels, in position order.
      description: >
        No panel carries its data - the browser posts each panel to
        /api/invoke itself (section 5, docs/specs/workspaces.md).
      tags:
        - workspaces
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The workspace, with its panels.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "404":
          description: No workspace has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteWorkspace
      summary: Delete a workspace and every panel it holds.
      description: >
        Deleting a workspace that does not exist is not an error: the end
        state is the same either way.
      tags:
        - workspaces
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The workspace, and its panels, no longer exist.
  /api/workspaces/{id}/panels:
    post:
      operationId: addPanel
      summary: Save a call as a panel on a workspace.
      description: >
        A panel is a saved call - service, operation id, arguments,
        component, title (W1). Naming an operation the catalogue does not
        expose is rejected here, at save time, with the same rule
        /api/invoke applies via the catalogue - a panel that could be
        saved unexposed would fail every time its workspace opened it.
      tags:
        - workspaces
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePanelRequest"
      responses:
        "201":
          description: The saved panel, with its assigned id and position.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Panel"
        "400":
          description: The named operation is not in the catalogue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No workspace has this id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/workspaces/{id}/panels/{panelId}:
    delete:
      operationId: deletePanel
      summary: Remove one panel from a workspace.
      description: >
        Deleting a panel that does not exist is not an error, for the same
        reason deleting a workspace that does not exist is not.
      tags:
        - workspaces
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: panelId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: The panel no longer exists on this workspace.
  /api/users:
    get:
      operationId: listUsers
      summary: List every account.
      description: >
        Every account the platform knows, admin only (docs/specs/auth.md,
        A5). A non-admin gets 403.
      tags:
        - users
      responses:
        "200":
          description: Every account.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "403":
          description: The signed-in account is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/users/{id}/permissions:
    get:
      operationId: getUserPermissions
      summary: Read one account's permissions.
      description: >
        Every operation the named account may call, admin only
        (docs/specs/auth.md, A5). A non-admin gets 403.
      tags:
        - users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The permissions the account holds.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Permission"
        "403":
          description: The signed-in account is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: setUserPermissions
      summary: Replace one account's permissions, wholesale.
      description: >
        Admin only (docs/specs/auth.md, A5). Replaces every permission the
        named account holds with the ones given - a grant screen writes
        the whole set it shows, not a diff against what was there before
        (usecase.PermissionStore.Set).
      tags:
        - users
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserPermissionsRequest"
      responses:
        "204":
          description: The account's permissions were replaced.
        "403":
          description: The signed-in account is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/operations:
    get:
      operationId: listOperations
      summary: List every operation across every configured service.
      description: >
        Every operation the catalogue holds, admin only
        (docs/specs/auth.md, section 4). GET /api/users/{id}/permissions
        answers only what one account already holds; the permission grid
        needs the whole catalogue to draw itself, grouped by service, and
        this is where it reads that from. A non-admin gets 403.
      tags:
        - users
      responses:
        "200":
          description: Every operation, across every configured service.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Operation"
        "403":
          description: The signed-in account is not an admin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/catalog:
    get:
      operationId: getCatalog
      summary: List every operation the signed-in person may call.
      description: >
        Every operation of `usecase.catalogFor(ctx, catalog, permissions,
        user)` - the whole catalogue for an admin, or the narrowed one for
        anybody else - each with its arguments schema (`schema`, as
        `/api/plan`'s form `schema`), its response fields (`fields`, as
        `/api/plan`'s result `fields`), and, when the contract declares
        `x-ui-hint.chart`, that chart's axes as `view`
        (docs/specs/dashboard.md, section 5). Built from the same rule
        /api/plan's tool list and /api/invoke's lookup are, so the
        operations a person can build a panel from and the ones they can
        ask a question about are the same set by construction
        (docs/specs/auth.md, section 5).
      tags:
        - catalog
      responses:
        "200":
          description: Every operation the signed-in person may call.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CatalogEntry"
components:
  schemas:
    Health:
      type: object
      description: The platform's health status.
      required:
        - status
      properties:
        status:
          type: string
          description: Always "ok" once the process is serving traffic.
    Role:
      type: string
      description: >
        What an account may do beyond the permissions it holds
        individually (docs/specs/auth.md, A5). An admin may read every
        account and set anybody's permissions; that is the whole of what
        the role buys.
      enum: [admin, user]
      x-enum-labels:
        admin: 管理者
        user: 一般
    User:
      type: object
      description: A signed-in account (docs/specs/auth.md, section 3).
      required:
        - id
        - name
        - role
      properties:
        id:
          type: string
          description: The account's id, assigned by the platform.
        name:
          type: string
          description: What the person types to sign in.
        role:
          $ref: "#/components/schemas/Role"
    SignInRequest:
      type: object
      description: A name and password to check against the platform's accounts.
      required:
        - name
        - password
      properties:
        name:
          type: string
          description: The account's name.
        password:
          type: string
          description: The account's password, in the clear over the wire (HTTPS carries it) - never stored this way (docs/specs/auth.md, section 3).
    Answer:
      type: object
      description: >
        The user's answer to a previous `kind: ask` response, resubmitted
        alongside the original query.
      required:
        - param
        - value
      properties:
        param:
          type: string
          description: The parameter name the value fills in.
        value:
          type: string
          description: The chosen value.
    Turn:
      type: object
      description: >
        One earlier question in the conversation, and what the platform
        decided for it - never the answer's data (docs/specs/context.md,
        section 3). `PlanRequest.turns` carries these oldest first.
      required:
        - question
        - kind
      properties:
        question:
          type: string
          description: The question, in Japanese, as it was asked.
        kind:
          $ref: "#/components/schemas/DecisionKind"
        service:
          type: string
          description: The service the decision named. Absent when kind is "none".
        operationId:
          type: string
          description: The operation id the decision named. Absent when kind is "none".
        args:
          type: object
          description: The arguments the decision was made with.
          additionalProperties: true
    PlanRequest:
      type: object
      description: A question, any answers to a previous disambiguation, and the conversation before it.
      required:
        - query
      properties:
        query:
          type: string
          description: The question, in Japanese.
        answers:
          type: array
          description: "Answers to a previous `kind: ask` response, if any."
          items:
            $ref: "#/components/schemas/Answer"
        turns:
          type: array
          description: >
            The conversation so far, oldest first. Absent or empty means
            what it means today: a question with no history
            (docs/specs/context.md, section 5).
          items:
            $ref: "#/components/schemas/Turn"
    DecisionKind:
      type: string
      description: What the planner decided to do about a question.
      enum: [result, form, ask, none]
      x-enum-labels:
        result: 結果
        form: フォーム
        ask: 質問
        none: 該当なし
    Component:
      type: string
      description: The widget the frontend renders the result with.
      enum: [table, detail, form, choice, chart]
      x-enum-labels:
        table: 表
        detail: 詳細
        form: フォーム
        choice: 選択
        chart: グラフ
    View:
      type: object
      description: How to draw a result - beside the call that says what to fetch.
      properties:
        transform:
          type: object
          required:
            - groupBy
            - aggregate
          properties:
            groupBy:
              type: string
              description: The field whose distinct values become rows.
            aggregate:
              type: string
              enum: [count, sum, avg]
              x-enum-labels:
                count: 件数
                sum: 合計
                avg: 平均
            field:
              type: string
              description: The field to aggregate. Absent for `count`.
        chart:
          type: object
          required:
            - category
            - value
            - kind
          properties:
            category:
              type: string
              description: The field named as the chart's category axis.
            value:
              type: string
              description: The field named as the chart's value axis.
            kind:
              type: string
              enum: [bar, line, pie]
              x-enum-labels:
                bar: 棒
                line: 折れ線
                pie: 円
    Source:
      type: object
      description: Which endpoint of which service a call was, or would be, made against.
      required:
        - service
        - operationId
      properties:
        service:
          type: string
          description: The service's name, as configured in ORCHESTRA_SERVICES.
        operationId:
          type: string
          description: The operation id, as declared in that service's contract.
        args:
          type: object
          description: The arguments the planner (or the user) supplied.
          additionalProperties: true
    Option:
      type: object
      description: One candidate value the user can pick, with its Japanese label.
      required:
        - value
        - label
      properties:
        value:
          type: string
          description: The enum value.
        label:
          type: string
          description: Its Japanese label (from x-enum-labels).
    PlanResult:
      type: object
      description: >
        The planner's decision and, when it was safe to act on immediately,
        its result. Which of the optional fields are present depends on
        `kind`: `result` carries `component`, `data`, `source`,
        when the response has columns to describe, `fields`, and, when the
        endpoint's contract declares `x-ui-hint.chart`, `view` (its `chart`
        half only - a contract declares axes, never a transform); `form`
        carries `schema`, `initial` and `target`; `ask` carries `question`,
        `param` and `options`; `none` carries `message`.
      required:
        - kind
      properties:
        kind:
          $ref: "#/components/schemas/DecisionKind"
        component:
          $ref: "#/components/schemas/Component"
        data:
          type: object
          description: The rendered result, when kind is "result".
          additionalProperties: true
        fields:
          type: object
          description: >
            Per-property JSON Schema for `data`'s columns (`table`) or own
            properties (`detail`), when kind is "result" - most importantly
            each enum property's `enumLabels` (value -> Japanese label), so
            a table cell or form control can show "検品保留" instead of
            "quarantined" without parsing a model-facing description string
            apart. Absent when the result has no columns to describe (not
            an empty object).
          additionalProperties: true
        view:
          $ref: "#/components/schemas/View"
        source:
          $ref: "#/components/schemas/Source"
        message:
          type: string
          description: A human-readable explanation, when kind is "none".
        schema:
          type: object
          description: The request body's JSON Schema, when kind is "form".
          additionalProperties: true
        initial:
          type: object
          description: The values the planner filled in, when kind is "form".
          additionalProperties: true
        target:
          $ref: "#/components/schemas/Source"
        question:
          type: string
          description: The question to show the user, when kind is "ask".
        param:
          type: string
          description: The parameter the answer will fill in, when kind is "ask".
        options:
          type: array
          description: The candidate values to choose from, when kind is "ask".
          items:
            $ref: "#/components/schemas/Option"
    InvokeRequest:
      type: object
      description: A confirmed call to execute.
      required:
        - service
        - operationId
        - args
      properties:
        service:
          type: string
          description: The service's name, as configured in ORCHESTRA_SERVICES.
        operationId:
          type: string
          description: The operation id, as declared in that service's contract.
        args:
          type: object
          description: The call's arguments.
          additionalProperties: true
    InvokeResult:
      type: object
      description: A call's rendered result.
      required:
        - component
        - data
      properties:
        component:
          $ref: "#/components/schemas/Component"
        data:
          type: object
          description: The rendered result.
          additionalProperties: true
        fields:
          type: object
          description: >
            Per-property JSON Schema for `data`'s columns (`table`) or own
            properties (`detail`) - the same shape as `PlanResult.fields`,
            built the same way, so a detail turn appended after a form
            submission shows a Japanese title and enum label exactly like a
            `/api/plan` result does. Absent when the result has no columns
            to describe (not an empty object).
          additionalProperties: true
    ErrorResponse:
      type: object
      description: A machine-readable error.
      required:
        - message
      properties:
        message:
          type: string
          description: What went wrong, for humans.
    WorkspaceSummary:
      type: object
      description: One row of the workspaces list - no panel data, only a count.
      required:
        - id
        - name
        - panelCount
      properties:
        id:
          type: string
          description: The workspace's id, assigned by the platform.
        name:
          type: string
          description: The workspace's name.
        panelCount:
          type: integer
          description: How many panels the workspace holds.
    CreateWorkspaceRequest:
      type: object
      description: A new, empty workspace.
      required:
        - name
      properties:
        name:
          type: string
          description: The workspace's name.
    WorkspaceCreated:
      type: object
      description: The workspace just created.
      required:
        - id
        - name
      properties:
        id:
          type: string
          description: The workspace's id, assigned by the platform.
        name:
          type: string
          description: The workspace's name.
    Panel:
      type: object
      description: >
        A saved call: everything a plan result's source and component
        already carry, plus a title and a position (docs/specs/workspaces.md,
        section 3). No panel carries its answer - opening a workspace
        re-runs each panel's call through /api/invoke instead (W2).
      required:
        - id
        - workspaceId
        - service
        - operationId
        - args
        - component
        - title
        - position
      properties:
        id:
          type: string
          description: The panel's id, assigned by the platform.
        workspaceId:
          type: string
          description: The workspace this panel belongs to.
        service:
          type: string
          description: The service's name, as configured in ORCHESTRA_SERVICES.
        operationId:
          type: string
          description: The operation id, as declared in that service's contract.
        args:
          type: object
          description: The call's arguments.
          additionalProperties: true
        component:
          $ref: "#/components/schemas/Component"
        title:
          type: string
          description: >
            The panel's title. A person can edit it; left blank when saved,
            it defaults to the operation id.
        position:
          type: integer
          description: >
            Where the panel sits among its workspace's others, ascending.
            Not editable in this slice (W5).
        view:
          $ref: "#/components/schemas/View"
    CreatePanelRequest:
      type: object
      description: A call to save as a new panel, appended after this workspace's others.
      required:
        - service
        - operationId
        - args
        - component
        - title
      properties:
        service:
          type: string
          description: The service's name, as configured in ORCHESTRA_SERVICES.
        operationId:
          type: string
          description: The operation id, as declared in that service's contract.
        args:
          type: object
          description: The call's arguments.
          additionalProperties: true
        component:
          $ref: "#/components/schemas/Component"
        title:
          type: string
          description: >
            The panel's title. Left blank, the panel is titled with its
            operation id instead of showing an empty card header.
        view:
          $ref: "#/components/schemas/View"
    Workspace:
      type: object
      description: One workspace and its panels, in position order.
      required:
        - id
        - name
        - panels
      properties:
        id:
          type: string
          description: The workspace's id, assigned by the platform.
        name:
          type: string
          description: The workspace's name.
        panels:
          type: array
          description: The workspace's panels, in position order.
          items:
            $ref: "#/components/schemas/Panel"
    Operation:
      type: object
      description: >
        One operation the catalogue holds - a service and operation id,
        with its summary, for the admin's permission grid
        (docs/specs/auth.md, section 4). GET /api/operations lists every
        one of these; Permission names which of them one account may call.
      required:
        - service
        - operationId
      properties:
        service:
          type: string
          description: The service's name, as configured in ORCHESTRA_SERVICES.
        operationId:
          type: string
          description: The operation id, as declared in that service's contract.
        summary:
          type: string
          description: The operation's summary, from its contract.
    CatalogEntry:
      type: object
      description: >
        One operation the signed-in person may call, with enough about it
        to build a panel over it (docs/specs/dashboard.md, section 5).
      required:
        - service
        - operationId
        - summary
        - displayName
        - component
        - schema
      properties:
        service:
          type: string
          description: The service's name, as configured in ORCHESTRA_SERVICES.
        operationId:
          type: string
          description: The operation id, as declared in that service's contract.
        summary:
          type: string
          description: >
            The operation's summary, from its contract. This is the
            model-facing tool description (`usecase.ToolsFor`), in whatever
            language the contract happens to use - never translated for
            display (DECISIONS.md, 2026-09-13) - so a screen meant to read
            in Japanese shows `displayName`, not this.
        displayName:
          type: string
          description: >
            The operation's name for a person to read, from its contract's
            `x-ui-hint.displayName` when it declares one, falling back to
            whatever that screen already showed before this field existed
            (`summary` here, the operation id in `list_capabilities`'
            table) when it does not - never blank (DECISIONS.md,
            2026-09-13).
        component:
          $ref: "#/components/schemas/Component"
        schema:
          type: object
          description: >
            The arguments a call takes, from `usecase.inputSchemaFor` - the
            same shape `/api/plan`'s `kind: form` result carries as its own
            `schema`, so the browser can build the same form over it.
          additionalProperties: true
        fields:
          type: object
          description: >
            Per-property JSON Schema for the response's fields, from
            `domain.FieldsSchema` - the same shape `/api/plan`'s result
            carries as `fields`, offered here as a chart's axes and a
            transform's `groupBy`. Absent when the response has no fields
            to describe (not an empty object).
          additionalProperties: true
        view:
          $ref: "#/components/schemas/View"
    Permission:
      type: object
      description: >
        One operation a person may call (docs/specs/auth.md, section 4,
        A3). A row says this person may call this operation; there is no
        deny, because there is nothing to override.
      required:
        - service
        - operationId
      properties:
        service:
          type: string
          description: The service's name, as configured in ORCHESTRA_SERVICES.
        operationId:
          type: string
          description: The operation id, as declared in that service's contract.
    SetUserPermissionsRequest:
      type: object
      description: >
        The whole set of permissions an account should hold, replacing
        whatever it held before (usecase.PermissionStore.Set).
      required:
        - permissions
      properties:
        permissions:
          type: array
          items:
            $ref: "#/components/schemas/Permission"
