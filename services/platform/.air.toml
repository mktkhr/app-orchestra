# air configuration for `make dev-platform`.
#
# Not part of the Repository Harness: this only wires up a developer
# convenience (hot reload) around the same `go build` / `cmd/api` that
# `make services-build` already produces. Build output goes to ./tmp, which
# is git-ignored (see /services/*/tmp/ in the root .gitignore).
root = "."
tmp_dir = "tmp"

[build]
cmd = "go build -o ./tmp/api ./cmd/api"
entrypoint = ["./tmp/api"]
# The catalogue is fetched over HTTP, so a hot-reloading platform needs to be
# told where the services are. These are the two services' own default ports
# (`make service-run SERVICE=inventory` and `SERVICE=attendance`), so
# `make dev-platform` answers real questions with no further configuration.
# The tool-calling planner (internal/adapter/planner/toolcall) is used once
# ORCHESTRA_LLM_BASE_URL is set - here, llama-swap's OpenAI-compatible port
# (started separately, not by this harness) - and falls back to the stub
# (an empty table, so every question comes back as "none") when it is not.
# qwen3.5-9b-q8 is the default model: measured against gemma4-26b-a4b-qat,
# gpt-oss-20b and qwen38-27b-iq3s with the same tool definitions, it is the
# only one of the four that neither invents an unrequested filter nor drops
# a requested one (DECISIONS.md, 2026-09-11).
# ORCHESTRA_DB_PATH points outside the repository - a hot-reloading platform
# rebuilds on every `.go` save (see include_ext below), and a file under this
# tree would either churn on every workspace write or get swept up by a
# careless `git clean`. $HOME/.local/state is this machine's normal home for
# a long-lived, non-package application file (XDG_STATE_HOME's default), so
# a workspace saved here survives both a rebuild and a restart of air itself
# (docs/specs/workspaces.md, AC-W-105) without living inside version control.
# ORCHESTRA_ADMIN_PASSWORD has no default (internal/infra/config.ErrMissingAdminPassword,
# docs/specs/auth.md, section 3): the platform refuses to start without one,
# so a hot-reloading dev server needs one too. This value is for local
# development only - it seeds the admin account once, the first time
# ORCHESTRA_DB_PATH's file is created, and is not read again afterwards.
full_bin = "ORCHESTRA_SERVICES=inventory=http://localhost:8081,attendance=http://localhost:8082 ORCHESTRA_LLM_BASE_URL=http://localhost:11435/v1 ORCHESTRA_LLM_MODEL=qwen3.5-9b-q8 ORCHESTRA_DB_PATH=/home/takahiro/.local/state/app-orchestra/workspaces.db ORCHESTRA_ADMIN_PASSWORD=dev-only-admin-password ./tmp/api"
include_ext = ["go"]
exclude_dir = ["tmp", "bin", "acceptance"]
delay = 200
stop_on_error = true
send_interrupt = true
kill_delay = "2s"

[log]
time = false

[misc]
clean_on_exit = true
