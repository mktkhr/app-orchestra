openapi: 3.0.3
info:
  title: Fixture API
  version: 0.1.0
  description: A minimal contract used only to test the catalogue converter.
  x-ui-hint:
    displayName: フィクスチャ
servers:
  - url: /
tags:
  - name: widgets
    description: Fixture widgets.
  - name: system
    description: The service's own contract.
paths:
  /openapi.yaml:
    get:
      operationId: getSpec
      summary: Return this service's own OpenAPI contract.
      tags:
        - system
      # Deliberately unmarked: the platform's own contract-fetching route,
      # never shown to a model. Also exercises the default-false case.
      responses:
        "200":
          description: The service's OpenAPI document, as YAML.
          content:
            application/yaml:
              schema:
                type: string
  /widgets:
    get:
      operationId: listWidgets
      summary: List widgets, optionally filtered by status.
      tags:
        - widgets
      x-orchestra-expose: true
      parameters:
        - name: status
          in: query
          required: false
          description: Restrict the result to widgets in this status.
          schema:
            $ref: "#/components/schemas/WidgetStatus"
      responses:
        "200":
          description: The matching widgets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WidgetList"
    post:
      operationId: createWidget
      summary: Create a widget.
      tags:
        - widgets
      x-orchestra-expose: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewWidget"
      responses:
        "201":
          description: The created widget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
  /widgets/{id}:
    get:
      operationId: getWidget
      summary: Get one widget by id.
      tags:
        - widgets
      x-orchestra-expose: true
      x-ui-hint:
        component: detail
        displayName: ウィジェットの詳細
      parameters:
        - name: id
          in: path
          required: true
          description: The widget's id.
          schema:
            type: string
      responses:
        "200":
          description: The requested widget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
  /widgets/export:
    get:
      operationId: exportWidgets
      summary: Export every widget as a YAML dump.
      tags:
        - widgets
      # Exposed, but answers YAML rather than JSON — exercises
      # convertResponse's nil-schema path for an operation the catalogue
      # actually carries (unlike getSpec, which never reaches it).
      x-orchestra-expose: true
      responses:
        "200":
          description: A YAML dump of every widget.
          content:
            application/yaml:
              schema:
                type: string
  /widgets/count:
    get:
      operationId: countWidgets
      summary: Count widgets by status.
      tags:
        - widgets
      x-orchestra-expose: true
      # No x-ui-hint.component: declaring x-ui-hint.chart alone is enough
      # for Render/RenderResult to choose the chart component
      # (docs/specs/dashboard.md, P2) - "no view configured" means exactly
      # this, no separate component override needed.
      x-ui-hint:
        chart:
          category: status
          value: count
          kind: bar
      responses:
        "200":
          description: Widget counts, grouped by status.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required:
                    - status
                    - count
                  properties:
                    status:
                      $ref: "#/components/schemas/WidgetStatus"
                    count:
                      type: integer
  /widgets/hidden:
    get:
      operationId: getHiddenWidget
      summary: Not marked at all; must not reach the catalogue.
      tags:
        - widgets
      responses:
        "200":
          description: The hidden widget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
  /widgets/off:
    get:
      operationId: getOffWidget
      summary: Explicitly marked false; must not reach the catalogue.
      tags:
        - widgets
      x-orchestra-expose: false
      responses:
        "200":
          description: The off widget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
  /widgets/bad:
    get:
      operationId: getBadWidget
      summary: Marked with a non-boolean value; must not reach the catalogue.
      tags:
        - widgets
      x-orchestra-expose: "true"
      responses:
        "200":
          description: The bad widget.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Widget"
components:
  schemas:
    WidgetStatus:
      type: string
      description: Where a widget sits in its workflow.
      enum: [allocated, staged, quarantined, consigned]
      x-enum-labels:
        allocated: 引当済
        staged: 出荷準備完了
        quarantined: 検品保留
        consigned: 預託在庫
    Widget:
      type: object
      description: A single widget.
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
        name:
          type: string
        status:
          $ref: "#/components/schemas/WidgetStatus"
    WidgetList:
      type: object
      description: A page of widgets.
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Widget"
    NewWidget:
      type: object
      description: The fields needed to create a widget.
      required:
        - name
        - status
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/WidgetStatus"
