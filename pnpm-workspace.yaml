# Workspace layout and pinned toolchain catalog.
# Part of the Repository Harness: see harness/quality/README.md before changing it.
packages:
  - web
  - web/acceptance
  - e2e

# Every workspace package must take these versions from the catalog so that the
# whole repository moves in lock-step.
catalog:
  # Vite+ ships its own Vite build; the alias mirrors the official vp create template.
  vite: npm:@voidzero-dev/vite-plus-core@0.3.1
  vite-plus: 0.3.1
  # Held at 6.x: openapi-typescript builds its output with the TypeScript
  # Compiler API (ts.factory), which TypeScript 7's native implementation does
  # not provide, so `make generate` dies on it. See DECISIONS.md, 2026-09-10.
  typescript: 6.0.3
  "@types/node": 24.13.4
  react: 19.3.0
  react-dom: 19.3.0
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.1
  "@testing-library/react": 16.3.3
  "@testing-library/dom": 10.4.1
  "@testing-library/user-event": 14.6.7
  happy-dom: 20.14.3
  oxc-parser: 0.149.0
  openapi-typescript: 7.13.0
  openapi-fetch: 0.17.0
  "@redocly/cli": 2.51.2
  "@playwright/test": 1.63.0

minimumReleaseAgeExclude:
  - "@types/node@24.13.4"
  - "@types/react-dom@19.3.0"
  - "@types/react@19.3.0"
  - happy-dom@20.14.3
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
